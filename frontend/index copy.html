<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOLO Object Detection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>YOLO Object Detection</h1>
            <p class="subtitle">Real-time object detection using YOLOv8</p>
        </header>

        <!-- Mode Selector -->
        <div class="mode-selector">
            <button id="cameraMode" class="mode-btn active">Camera</button>
            <button id="uploadMode" class="mode-btn">Upload Image</button>
        </div>

        <!-- Main Content Area -->
        <div class="content">
            <!-- Camera Mode -->
            <div id="cameraModeContent" class="mode-content active">
                <div class="video-container">
                    <video id="videoElement" autoplay playsinline></video>
                    <canvas id="videoCanvas"></canvas>
                </div>
                <div class="camera-controls">
                    <button id="startCamera" class="btn btn-primary">Start Camera</button>
                    <button id="stopCamera" class="btn btn-secondary" style="display: none;">Stop Camera</button>
                    <button id="captureFrame" class="btn btn-success" style="display: none;">Detect Objects</button>
                </div>
                <div id="cameraStatus" class="status-message"></div>
            </div>

            <!-- Upload Mode -->
            <div id="uploadModeContent" class="mode-content">
                <div id="dropZone" class="drop-zone">
                    <div class="drop-zone-content">
                        <svg class="upload-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                        </svg>
                        <p class="drop-text">Drag & drop an image here</p>
                        <p class="or-text">or</p>
                        <button id="chooseFileBtn" class="btn btn-primary">Choose File</button>
                        <input type="file" id="fileInput" accept="image/*" style="display: none;">
                        <p class="file-info">Supported formats: JPG, PNG, BMP, WebP (Max 10MB)</p>
                    </div>
                </div>
                <div id="imagePreview" class="image-preview">
                    <canvas id="uploadCanvas"></canvas>
                    <div class="upload-actions">
                        <button id="uploadNewBtn" class="btn btn-secondary">Upload New Image</button>
                    </div>
                </div>
            </div>

            <!-- Controls Panel -->
            <div class="controls-panel">
                <div class="control-group">
                    <label for="confidenceSlider">
                        Confidence Threshold: <span id="confidenceValue">0.25</span>
                    </label>
                    <input type="range" id="confidenceSlider" min="0.1" max="0.9" step="0.05" value="0.25">
                </div>
                <div class="control-group">
                    <label>
                        <input type="checkbox" id="autoDetect" checked>
                        Auto-detect (Camera Mode)
                    </label>
                </div>
            </div>

            <!-- Results Display -->
            <div id="resultsContainer" class="results-container" style="display: none;">
                <h3>Detection Results</h3>
                <div class="results-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="objectCount">0</div>
                        <div class="stat-label">Objects Detected</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="processingTime">0ms</div>
                        <div class="stat-label">Processing Time</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="fps">0</div>
                        <div class="stat-label">FPS</div>
                    </div>
                </div>

                <div class="detections-list">
                    <h4>Detected Objects</h4>
                    <div id="detectionsList"></div>
                </div>
            </div>

            <!-- Loading Indicator -->
            <div id="loadingIndicator" class="loading-indicator" style="display: none;">
                <div class="spinner"></div>
                <p>Processing...</p>
            </div>

            <!-- Error Message -->
            <div id="errorMessage" class="error-message" style="display: none;"></div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>Powered by YOLOv8 | <a href="/docs" target="_blank">API Documentation</a></p>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="/static/js/api.js"></script>
    <script src="/static/js/camera.js"></script>
    <script src="/static/js/upload.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
