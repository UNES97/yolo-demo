version: '3.8'

services:
  yolo-app:
    build: .
    container_name: yolo-detection-app
    ports:
      - "8000:8000"
    volumes:
      # Mount uploads directory to persist uploaded files
      - ./uploads:/app/uploads
      # Mount models cache to persist downloaded models
      - ./models_cache:/app/models_cache
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
